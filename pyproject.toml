[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrophoto-scripts"
version = "1.0.0"
description = "CLI pipeline for multi-exposure astrophotography, RAW/DNG, and landscape stacking."
readme = "README.md"
authors = [
    { name = "T-Dynamos" },
    { name = "Antigravity" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "tifffile>=2023.7.10",
    "rawpy>=0.20.0"
]

[project.scripts]
astrophoto = "astrophoto.cli:main"
